services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 2s
      timeout: 5s
      retries: 15

  web:
    image: ruby:3.4
    working_dir: /app
    command: >
      bash -c "bundle install &&
               rm -f tmp/pids/server.pid &&
               bin/rails db:prepare &&
               bin/rails server -b 0.0.0.0"
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      # No RAILS_ENV here: the server defaults to development, and it lets
      # `docker compose run web bundle exec rspec` pick the test env itself.
      DATABASE_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  bundle:
  pgdata:
