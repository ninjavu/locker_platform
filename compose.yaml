services:
  web:
    image: ruby:3.4
    working_dir: /app
    command: >
      bash -c "bundle install &&
               rm -f tmp/pids/server.pid &&
               bin/rails db:prepare &&
               bin/rails server -b 0.0.0.0"
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development

volumes:
  bundle:
